    <div class="container">
        <h1 class="contact-title">Autentificare</h1>
        <p>Nu ai un cont? Creează unul acum.</p>

        <form id="login-form" class="contact-form">
            <input id="username" name="username" type="text" placeholder="Numele de utilizator" required>
            <input id="email" name="email" type="email" placeholder="Emailul tău" required>
            <input id="password" name="password" type="password" placeholder="Parola ta" required>
            <button type="submit">Autentificare</button>
        </form>

        <p id="login-message"></p>
    </div>

    <script src="login.js"></script>
